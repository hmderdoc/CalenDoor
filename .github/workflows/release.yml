name: release

# Tag a release to build it:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: "386" }            # 32-bit Linux
          - { goos: linux,   goarch: arm64 }            # Raspberry Pi 64-bit, ARM servers
          - { goos: linux,   goarch: arm, goarm: "6" }  # 32-bit ARM (older Pi)
          - { goos: windows, goarch: amd64 }            # 64-bit Windows
          - { goos: windows, goarch: "386" }            # 32-bit Windows (Win7+)
          - { goos: darwin,  goarch: amd64 }            # Intel mac
          - { goos: darwin,  goarch: arm64 }            # Apple Silicon
          - { goos: freebsd, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build + package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME}"
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          NAME="calendoor_${VERSION}_${GOOS}_${GOARCH}"
          OUT="dist/$NAME"
          mkdir -p "$OUT"

          LDFLAGS="-s -w -X main.version=${VERSION}"
          go build -trimpath -ldflags "$LDFLAGS" -o "$OUT/calendoor$EXT" ./cmd/calendoor

          cp README.md calendar.ini.example "$OUT/"
          [ -f LICENSE ] && cp LICENSE "$OUT/" || true

          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip -r "$NAME.zip" "$NAME"
          else
            tar czf "$NAME.tar.gz" "$NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: calendoor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
